<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortfolioOS</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171e27; --panel2: #1e2733; --line: #2c3a4a;
    --text: #e7ecf1; --muted: #93a1b3; --accent: #5eead4; --danger: #f87171; --ok: #86efac;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .login {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(900px 400px at 50% -10%, #1a3340, transparent);
  }
  .login-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .login-card h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 650; }
  .muted { color: var(--muted); }
  label { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); margin-top: 14px; }
  input {
    background: #0f1419; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .btn {
    margin-top: 16px; width: 100%; background: #134e4a; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: #0f766e; }
  .btn.ghost { width: auto; background: transparent; border: 1px solid var(--line); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chips button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; font-size: 0.8rem; }
  .err { color: var(--danger); min-height: 1.2em; font-size: 0.9rem; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 18px 14px; background: #121820; }
  .brand { font-weight: 700; letter-spacing: -0.02em; margin-bottom: 18px; }
  .navbtn {
    display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px;
    padding: 8px 10px; cursor: pointer; color: var(--muted); margin-bottom: 4px;
  }
  .navbtn.on { background: #1e293b; color: var(--text); }
  .who { margin-top: 24px; font-size: 0.82rem; color: var(--muted); }
  main { padding: 22px 26px 40px; }
  h2 { margin: 0 0 4px; font-weight: 650; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; text-align: left; width: 100%; }
  .card:hover { border-color: #3d5166; }
  .card h3 { margin: 0 0 4px; font-size: 1rem; }
  .bar { height: 6px; background: #0f1419; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 16px; }
  .tabs button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .tabs button.on { background: var(--panel2); border-color: #3d5166; }
  .pill { font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; background: #243044; color: #7dd3fc; }
  .pill.warn { background: #3f2d12; color: #fbbf24; }
  .pill.ok { background: #143024; color: var(--ok); }
  form.inline { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; margin-bottom: 12px; }
  form.inline label { margin: 0; }
  form.inline .btn, form.inline .btn.ghost { width: auto; margin: 0; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login">
  <form class="login-card" id="login-form">
    <h1>PortfolioOS</h1>
    <p class="muted">Sign in with a seeded account. This page is the product UI, using the same people, organisations and KPIs as the running app.</p>
    <label>Email <input id="email" autocomplete="username" value="owner@portfolio.local" /></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" value="password123" /></label>
    <p class="err" id="err"></p>
    <button class="btn" type="submit">Sign in</button>
    <div class="chips" id="chips"></div>
  </form>
</div>
<div id="app" class="app hide">
  <aside>
    <div class="brand">PortfolioOS</div>
    <div id="nav"></div>
    <div class="who" id="who"></div>
    <button class="btn ghost" id="logout" type="button" style="margin-top:12px">Sign out</button>
  </aside>
  <main id="view"></main>
</div>

const state = { user: null, membership: null, screen: 'portfolio', org: null, tab: 'overview', submissions: [] };

const byUserKey = Object.fromEntries(DATA.users.map(u => [u.key, u]));
const orgBySlug = Object.fromEntries(DATA.orgs.map(o => [o.slug, o]));

function membershipsFor(userKey) {
  return DATA.memberships.filter(m => m.userKey === userKey);
}
function primaryMembership(userKey) {
  const rank = { owner: 0, manager: 1, vice_manager: 2, team_lead: 3, member: 4 };
  return membershipsFor(userKey).slice().sort((a,b) => rank[a.role] - rank[b.role])[0];
}
function peopleIn(slug) {
  return DATA.memberships.filter(m => m.orgSlug === slug).map(m => ({ ...m, user: byUserKey[m.userKey] }));
}
function kpisIn(slug) {
  return DATA.kpis.filter(k => k.code.startsWith(slug + '.'));
}
function readiness(slug) {
  const people = peopleIn(slug);
  const named = people.filter(p => p.state !== 'pending_name').length;
  const kpis = kpisIn(slug);
  const targeted = kpis.filter(k => k.target != null).length;
  return { people: people.length, named, kpis: kpis.length, targeted };
}

document.getElementById('login-form').onsubmit = (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const user = DATA.users.find(u => u.email === email && u.password === password);
  const err = document.getElementById('err');
  if (!user) { err.textContent = 'Invalid credentials'; return; }
  err.textContent = '';
  state.user = user;
  state.membership = primaryMembership(user.key);
  state.org = state.membership.orgSlug;
  state.screen = state.membership.role === 'owner' ? 'portfolio' : 'org';
  state.tab = state.membership.role === 'member' ? 'today' : 'overview';
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  render();
};
document.getElementById('logout').onclick = () => {
  state.user = null;
  document.getElementById('app').classList.add('hide');
  document.getElementById('login').classList.remove('hide');
};

function esc(s) {
  return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderNav() {
  const role = state.membership.role;
  const items = [];
  if (role === 'owner') items.push(['portfolio', 'Portfolio']);
  if (role === 'owner' && state.org) items.push(['org', orgBySlug[state.org].short_name]);
  if (role !== 'owner') items.push(['org', orgBySlug[state.org].short_name]);
  document.getElementById('nav').innerHTML = items.map(([id, label]) =>
    '<button class="navbtn'+(state.screen===id?' on':'')+'" data-screen="'+id+'">'+esc(label)+'</button>').join('');
  document.getElementById('nav').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.screen = b.dataset.screen;
    render();
  };
  const orgLabel = state.membership.orgSlug ? ' · ' + state.membership.orgSlug : ' · portfolio';
  document.getElementById('who').innerHTML = '<strong>'+esc(state.user.full_name)+'</strong><br>'+esc(state.membership.role)+esc(orgLabel);
}

function portfolioView() {
  const cards = DATA.orgs.map(o => {
    const r = readiness(o.slug);
    const namedPct = Math.round(100 * r.named / r.people);
    const tgtPct = Math.round(100 * r.targeted / r.kpis);
    return '<button class="card" data-org="'+o.slug+'"><h3>'+esc(o.short_name)+'</h3><div class="muted">'+esc(o.sector)+'</div><p class="muted" style="margin:8px 0 0">'+esc(o.positioning)+'</p><div class="muted" style="margin-top:10px;font-size:0.8rem">Roster named '+r.named+'/'+r.people+'</div><div class="bar"><span style="width:'+namedPct+'%"></span></div><div class="muted" style="margin-top:8px;font-size:0.8rem">KPI targets '+r.targeted+'/'+r.kpis+'</div><div class="bar"><span style="width:'+tgtPct+'%"></span></div></button>';
  }).join('');
  const unnamed = DATA.memberships.filter(m => m.state === 'pending_name');
  const missing = DATA.kpis.filter(k => k.target == null);
  return '<div class="row"><div><h2>Portfolio</h2><p class="muted">Seven organisations. Readiness first — most KPIs have no target yet, so nothing is shown as green.</p></div></div><div class="cards">'+cards+'</div><h2 style="margin-top:28px">Data readiness</h2><p class="muted">'+unnamed.length+' people still unnamed. '+missing.length+' of '+DATA.kpis.length+' KPIs have no target. SAI is the only organisation with a fully named roster.</p>';
}

function orgView() {
  const o = orgBySlug[state.org];
  const r = readiness(o.slug);
  const tabs = [['overview','Overview'],['kpis','KPIs'],['team','Team'],['today','Today']];
  const tabBar = '<div class="tabs">'+tabs.map(([id,label]) => '<button type="button" data-tab="'+id+'" class="'+(state.tab===id?'on':'')+'">'+label+'</button>').join('')+'</div>';
  return '<div class="row"><div><h2>'+esc(o.name)+'</h2><p class="muted">'+esc(o.descriptor)+' · '+esc(o.positioning)+'</p></div><span class="pill'+(r.named===r.people?' ok':' warn')+'">'+(r.named===r.people?'Roster complete':'Roster incomplete')+'</span></div>'+tabBar+'<div id="tab"></div>';
}

function overviewHTML() {

function kpisHTML() {
  const role = state.membership.role;
  const rows = kpisIn(state.org).filter(k => {
    if (role !== 'member') return true;
    return k.ownerKey === state.membership.key;
  }).map(k => {
    const owner = DATA.memberships.find(m => m.key === k.ownerKey);
    const person = owner ? byUserKey[owner.userKey].full_name : '—';
    const target = k.target == null ? '<span class="pill warn">no target</span>' : esc(k.target)+' '+esc(k.unit);
    return '<tr><td><code>'+esc(k.code)+'</code><br><span class="muted">'+esc(k.name)+'</span></td><td>'+esc(person)+'</td><td>'+esc(k.how_often||'')+'</td><td>'+target+'</td><td>'+esc(k.source_tag)+'</td></tr>';
  }).join('');
  const note = role === 'member' ? '<p class="muted">You only see KPIs assigned to you.</p>' : '';
  let setter = '';
  if (state.membership.key === 'm_sai_lead' && state.org === 'sai') {
    const opts = kpisIn('sai').map(k => '<option value="'+esc(k.code)+'">'+esc(k.code)+'</option>').join('');
    setter = '<form class="inline" id="target-form"><label>KPI<select id="target-kpi">'+opts+'</select></label><label>Target<input id="target-val" type="number" step="any" required style="width:120px" /></label><button class="btn" type="submit">Set target</button></form><p class="muted">Nagaraj can set SAI targets. Thyagu still sets them for the other organisations.</p>';
  }
  return setter+note+'<table><thead><tr><th>KPI</th><th>Owner</th><th>How often</th><th>Target</th><th>Source</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function teamHTML() {
  const people = peopleIn(state.org);
  const rows = people.map(p => '<tr><td>'+esc(p.user.full_name)+'</td><td>'+esc(p.title)+'</td><td>'+esc(p.role)+'</td><td>'+(p.state==='pending_name'?'<span class="pill warn">name pending</span>':'<span class="pill ok">named</span>')+'</td></tr>').join('');
  return '<table><thead><tr><th>Name</th><th>Title</th><th>Role</th><th>Roster</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function todayHTML() {
  const role = state.membership.role;
  const kpis = kpisIn(state.org).filter(k => role !== 'member' || k.ownerKey === state.membership.key);
  const subs = state.submissions.filter(s => s.org === state.org);
  let form = '';
  if (role === 'member' || role === 'manager' || role === 'vice_manager' || role === 'team_lead') {
    const opts = kpis.map(k => '<option value="'+esc(k.code)+'">'+esc(k.code)+'</option>').join('');
    form = '<form class="inline" id="sub-form"><label>KPI<select id="sub-kpi">'+opts+'</select></label><label>Value<input id="sub-val" type="number" step="any" required style="width:120px" /></label><button class="btn" type="submit">Submit</button></form>';
  }
  const rows = subs.map(s => {
    let actions = '<span class="pill">'+esc(s.state)+'</span>';
    if ((role === 'manager' || role === 'vice_manager' || role === 'team_lead' || role === 'owner') && s.state === 'submitted') {
      actions = '<button class="btn ghost" data-act="accept" data-id="'+s.id+'">Accept</button> <button class="btn ghost" data-act="reject" data-id="'+s.id+'">Reject</button>';
    }
    if (s.state === 'validated' || s.state === 'locked') actions = '<span class="pill ok">'+esc(s.state)+'</span>';
    if (s.state === 'rejected') actions = '<span class="pill warn">rejected</span>';
    return '<tr><td><code>'+esc(s.code)+'</code></td><td>'+esc(s.by)+'</td><td>'+esc(s.value)+'</td><td>'+actions+'</td></tr>';
  }).join('') || '<tr><td colspan="4" class="muted">Nothing submitted for this organisation in this session.</td></tr>';
  let signoff = '';
  if (role === 'manager' || role === 'owner') {
    const locked = subs.some(s => s.state === 'locked');
    signoff = '<button class="btn" id="signoff" type="button" '+(locked?'disabled':'')+'>'+(locked?'Day locked':'Sign off and lock validated rows')+'</button>';
  }
  return form+'<table><thead><tr><th>KPI</th><th>By</th><th>Value</th><th></th></tr></thead><tbody>'+rows+'</tbody></table><div style="margin-top:12px">'+signoff+'</div>';
}

function bindOrg() {
  const tab = document.getElementById('tab');
  if (!tab) return;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  if (state.tab === 'overview') tab.innerHTML = overviewHTML();
  if (state.tab === 'kpis') {
    tab.innerHTML = kpisHTML();
    const form = document.getElementById('target-form');
    if (form) form.onsubmit = (e) => {
      e.preventDefault();
      const code = document.getElementById('target-kpi').value;
      const kpi = DATA.kpis.find(k => k.code === code);
      if (!kpi) return;
      const value = Number(document.getElementById('target-val').value);
      kpi.target = value;
      kpi.green_at = value;
      kpi.amber_at = value * 0.8;
      render();
    };
  }
  if (state.tab === 'team') tab.innerHTML = teamHTML();
  if (state.tab === 'today') {
    tab.innerHTML = todayHTML();
    const form = document.getElementById('sub-form');
    if (form) form.onsubmit = (e) => {
      e.preventDefault();
      state.submissions.push({
        id: String(Date.now()),
        org: state.org,
        code: document.getElementById('sub-kpi').value,
        value: document.getElementById('sub-val').value,
        by: state.user.full_name,
        state: 'submitted'
      });
      render();
    };
    tab.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b || !b.dataset.act) return;
      const row = state.submissions.find(s => s.id === b.dataset.id);
      if (!row) return;
      row.state = b.dataset.act === 'accept' ? 'validated' : 'rejected';
      render();
    };
    const sign = document.getElementById('signoff');
    if (sign) sign.onclick = () => {
      state.submissions.forEach(s => { if (s.org === state.org && s.state === 'validated') s.state = 'locked'; });
      render();
    };
  }
}

function render() {
  renderNav();
  const view = document.getElementById('view');
  if (state.screen === 'portfolio') {
    view.innerHTML = portfolioView();
    view.onclick = (e) => {
      const card = e.target.closest('[data-org]');
      if (!card) return;
      state.org = card.dataset.org;
      state.screen = 'org';
      state.tab = 'overview';
      render();
    };
  } else {
    view.innerHTML = orgView();
    view.onclick = null;
    bindOrg();
  }
}
</script>
</body>
</html>
