[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:livekit]
command=/usr/local/bin/livekit-server --config /etc/livekit/livekit.yaml
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# The Qlix Meeting Assistant's bot: joins rooms when the API dispatches it (docs/MEETINGS.md).
# MEETING_BOT_AUTOSTART=false when the bot runs elsewhere (scripts/dev.sh runs it natively).
[program:meeting-bot]
command=/opt/meeting-bot/.venv/bin/python bot.py start
directory=/opt/meeting-bot
environment=LIVEKIT_URL="ws://127.0.0.1:7880"
autostart=%(ENV_MEETING_BOT_AUTOSTART)s
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
